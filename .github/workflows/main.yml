name: Diagnose LineGuard Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Show repository files and pnpm configuration
        shell: bash
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd
          ls -la

          echo "===== ROOT package.json ====="
          if [ -f package.json ]; then
            cat package.json
          else
            echo "No package.json at repository root"
          fi

          echo "===== ROOT pnpm-workspace.yaml ====="
          if [ -f pnpm-workspace.yaml ]; then
            cat pnpm-workspace.yaml
          else
            echo "No pnpm-workspace.yaml at repository root"
          fi

          echo "===== PNPM VERSION ====="
          pnpm --version

          echo "===== ALL PACKAGE MANIFESTS ====="
          find . \
            -type d \( -name node_modules -o -name .git \) -prune \
            -o -type f -name package.json -print

          echo "===== FILES REFERENCING @types/node ====="
          grep -R -n --include="package.json" --include="pnpm-workspace.yaml" \
            "@types/node" . \
            --exclude-dir=node_modules \
            --exclude-dir=.git || true
